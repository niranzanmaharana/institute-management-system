spring:
  application:
    name: ims-api
  datasource:
    url: jdbc:mysql://localhost:3306/ims?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.example.com
    port: 587
    username: your-smtp-user
    password: your-smtp-password
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
      export:
        enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

ims:
  security:
    # Override via IMS_SECURITY_JWT_SECRET in non-local environments.
    jwt-secret: ims-dev-jwt-secret-change-me-32chars-min!!
    access-token-minutes: 30
    refresh-token-days: 14
    max-failed-logins: 5
    lock-minutes: 15
    expose-openapi: true
    reject-insecure-jwt-secret: false
  storage:
    type: s3
    endpoint: http://localhost:9000
    access-key: minio
    secret-key: minio12345
    bucket: ims-private
    region: us-east-1
    path-style: true
    presign-expiry-minutes: 10
    max-size-bytes: 5242880
    cors-origins:
      - http://localhost:4200
      - http://127.0.0.1:4200
  notification:
    enabled: true
    # logging = in-memory sink (local/CI); smtp = JavaMail (set spring.mail.*)
    channel: logging
    from: niranzan.in@gmail.com
    max-attempts: 5
    initial-retry-seconds: 30
    backoff-multiplier: 2.0
    retry-poll-ms: 15000

logging:
  level:
    root: INFO
    com.ims: INFO
  pattern:
    console: "%d{ISO8601} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] requestId=%X{requestId:-} userId=%X{userId:-} %logger{36} - %msg%n"
