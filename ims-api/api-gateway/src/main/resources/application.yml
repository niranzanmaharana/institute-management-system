server:
  port: 8088

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - RemoveRequestHeader=X-Institute-Id
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - X-Request-Id
            maxAge: 3600
      routes:
        - id: ims-application
          uri: http://localhost:8080
          predicates:
            - Path=/api/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/actuator/health/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
      # Jaeger is optional. Off by default so logs stay clean when compose jaeger is not running.
      # Enable with MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED=true and `docker compose up -d jaeger`.
      export:
        enabled: false

ims:
  gateway:
    login-rate-limit:
      max-attempts: 20
      window-seconds: 60

logging:
  level:
    root: INFO
    com.ims: INFO
    com.ims.gateway: INFO
  pattern:
    console: "%d{ISO8601} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] requestId=%X{requestId:-} userId=%X{userId:-} %logger{36} - %msg%n"
