<div class="page">
  <header class="page__header">
    <div>
      <h1>Add student</h1>
      <p>Create a student for the current institute</p>
    </div>
    <a routerLink="/students">Back to list</a>
  </header>

  <app-ui-card>
    @if (error()) {
      <app-error-state title="Create failed" [message]="error()!" />
    }
    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="code-field">
        <app-ui-input
          label="Student code (optional)"
          inputId="stu-code"
          formControlName="studentCode"
        />
        <app-ui-button type="button" [loading]="generating()" (click)="generateCode()">
          Generate
        </app-ui-button>
        <p class="hint">Leave blank to auto-generate on save (institute id + 6-digit sequence).</p>
      </div>
      <div class="grid">
        <app-ui-input label="First name" inputId="stu-fn" formControlName="firstName" />
        <app-ui-input label="Last name" inputId="stu-ln" formControlName="lastName" />
        <app-ui-input label="Phone" inputId="stu-phone" formControlName="phone" />
        <app-ui-input label="Email" inputId="stu-email" type="email" formControlName="email" />
      </div>

      <h2>Guardian (optional)</h2>
      <div class="grid">
        <app-ui-input label="Guardian name" inputId="g-name" formControlName="guardianName" />
        <app-ui-input label="Guardian phone" inputId="g-phone" formControlName="guardianPhone" />
        <app-ui-input label="Relation" inputId="g-rel" formControlName="guardianRelation" />
      </div>

      <h2>Address (optional)</h2>
      <div class="grid">
        <app-ui-input label="Line 1" inputId="a-line1" formControlName="addressLine1" />
        <app-ui-input label="City" inputId="a-city" formControlName="city" />
        <app-ui-input label="State" inputId="a-state" formControlName="state" />
        <app-ui-input label="Postal code" inputId="a-postal" formControlName="postalCode" />
      </div>

      <app-ui-button type="submit" [loading]="submitting()" [block]="true">Save student</app-ui-button>
    </form>
  </app-ui-card>
</div>
