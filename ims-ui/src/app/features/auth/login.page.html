<div class="login">
  <form class="login__card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="login__brand">
      @if (brandLogoUrl(); as logo) {
        <img class="login__logo-img" [src]="logo" [alt]="brandName() + ' logo'" width="56" height="56" />
      } @else {
        <span class="login__logo">IMS</span>
      }
      <h1>Sign in</h1>
      <p>{{ brandName() }}</p>
    </div>

    <app-ui-input
      label="Username"
      inputId="username"
      autocomplete="username"
      formControlName="username"
    />
    <app-ui-input
      label="Password"
      inputId="password"
      type="password"
      autocomplete="current-password"
      formControlName="password"
    />
    <app-ui-input
      label="Institute code"
      inputId="instituteCode"
      hint="Leave empty for platform admin"
      autocomplete="organization"
      formControlName="instituteCode"
    />

    <app-ui-button type="submit" [loading]="submitting()" [block]="true">Sign in</app-ui-button>

    <p class="login__hint">
      Demo: <strong>admin</strong> / <strong>Password@123</strong> / <strong>DEMO_A</strong>
    </p>
  </form>
</div>
