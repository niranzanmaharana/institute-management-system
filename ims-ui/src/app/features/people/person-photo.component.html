<div class="photo">
  @if (canWrite) {
    <button
      type="button"
      class="photo__avatar"
      [class.photo__avatar--busy]="uploading()"
      [disabled]="uploading()"
      [attr.aria-label]="url() ? 'Change profile photo' : 'Add profile photo'"
      (click)="openPicker()"
    >
      @if (url(); as src) {
        <img class="photo__img" [src]="src" [alt]="alt" width="96" height="96" />
      } @else {
        <span class="photo__fallback" aria-hidden="true">{{ initials }}</span>
      }
      <span class="photo__camera" aria-hidden="true">
        @if (uploading()) {
          <i class="fa-solid fa-spinner fa-spin"></i>
        } @else {
          <i class="fa-solid fa-camera"></i>
        }
      </span>
    </button>
    <input
      #fileInput
      class="photo__input"
      type="file"
      accept=".jpg,.jpeg,.png,image/jpeg,image/png"
      [disabled]="uploading()"
      (change)="onFileChange($event)"
    />
  } @else {
    <div class="photo__avatar photo__avatar--readonly">
      @if (url(); as src) {
        <img class="photo__img" [src]="src" [alt]="alt" width="96" height="96" />
      } @else {
        <span class="photo__fallback" aria-hidden="true">{{ initials }}</span>
      }
    </div>
  }
</div>
